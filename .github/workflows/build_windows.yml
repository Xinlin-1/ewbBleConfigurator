name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:

      # 1. 拉取源码
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. 安装 Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. 安装依赖
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 4. 检查 Python 环境
      - name: Check Python environment
        shell: pwsh
        run: |
          python --version
          pip list


      # 5. 检查 Bleak
      - name: Check Bleak installation
        shell: pwsh
        run: |
          python -c "import bleak; print('Bleak OK:', bleak.__version__)"


      # 6. 检查源码文件
      - name: Check source file
        shell: pwsh
        run: |
          if (!(Test-Path "ewbBleConfigurator_v1.4.0.py")) {
              Write-Error "Source file ewbBleConfigurator_v1.4.0.py not found"
              exit 1
          }

          Write-Host "Source file found"


      # 7. PyInstaller生成EXE
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --clean `
            --name ewbBleConfigurator_v1.4.0 `
            ewbBleConfigurator_v1.4.0.py


      # 8. 检查生成结果
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ewbBleConfigurator_v1.4.0.exe")) {
              Write-Error "EXE build failed"
              exit 1
          }

          Get-Item "dist/ewbBleConfigurator_v1.4.0.exe"


      # 9. 上传EXE
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewbBleConfigurator_v1.4.0_Win64
          path: dist/ewbBleConfigurator_v1.4.0.exe
