name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:

      # 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4


      # 安装 Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 安装依赖
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 查看 Python 环境
      - name: Check Python environment
        shell: pwsh
        run: |
          python --version
          pip list


      # 检查 Bleak 是否可以正常导入
      - name: Check Bleak installation
        shell: pwsh
        run: |
          python -c "import bleak; print('Bleak import OK')"
          python -c "import bleak_winrt; print('bleak-winrt import OK')"


      # 检查源码文件是否存在
      - name: Check source file
        shell: pwsh
        run: |
          if (!(Test-Path "ewbBleConfigurator_v1.7.0_SimpleAutoReset.py")) {
              Write-Error "Cannot find ewbBleConfigurator_v1.7.0_SimpleAutoReset.py"
              exit 1
          }

          Write-Host "Source file OK"
          Get-Item "ewbBleConfigurator_v1.7.0_SimpleAutoReset.py"


      # 使用 PyInstaller 编译 EXE
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --clean `
            --collect-all bleak `
            --collect-all bleak_winrt `
            --hidden-import bleak `
            --hidden-import bleak.backends.winrt `
            --hidden-import bleak.backends.winrt.client `
            --hidden-import bleak.backends.winrt.scanner `
            --hidden-import bleak_winrt `
            --hidden-import bleak_winrt.windows.devices.bluetooth `
            --hidden-import bleak_winrt.windows.devices.enumeration `
            --name ewbBleConfigurator_v1.7.0_SimpleAutoReset `
            ewbBleConfigurator_v1.7.0_SimpleAutoReset.py


      # 检查 EXE 是否成功生成
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ewbBleConfigurator_v1.7.0_SimpleAutoReset.exe")) {
              Write-Error "EXE was not generated"
              exit 1
          }

          Write-Host "EXE generated successfully:"
          Get-Item "dist/ewbBleConfigurator_v1.7.0_SimpleAutoReset.exe"


      # 上传 EXE
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewbBleConfigurator_v1.7.0_SimpleAutoReset_Win64
          path: dist/ewbBleConfigurator_v1.7.0_SimpleAutoReset.exe
