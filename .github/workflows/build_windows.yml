name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:

      # 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4


      # 安装 Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 安装依赖
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # 查看环境
      - name: Check Python environment
        shell: pwsh
        run: |
          python --version
          pip list


      # 检查 Bleak 是否可导入
      - name: Check Bleak installation
        shell: pwsh
        run: |
          python -c "import bleak; print('Bleak import OK')"


      # 检查源码
      - name: Check source file
        shell: pwsh
        run: |

          if (!(Test-Path "ewbBleConfigurator_v1.4.0.py")) {

              Write-Error "Cannot find ewbBleConfigurator_v1.4.0.py"

              exit 1

          }

          Write-Host "Source file OK"


      # 使用 PyInstaller 编译 EXE
      - name: Build EXE
        shell: pwsh
        run: |

          pyinstaller `
            --onefile `
            --console `
            --clean `
            --name ewbBleConfigurator_v1.4.0 `
            --hidden-import bleak `
            --hidden-import bleak.backends.winrt `
            --hidden-import bleak.backends.winrt.client `
            --hidden-import bleak.backends.winrt.scanner `
            ewbBleConfigurator_v1.4.0.py


      # 检查 EXE
      - name: Verify EXE
        shell: pwsh
        run: |

          if (!(Test-Path "dist/ewbBleConfigurator_v1.4.0.exe")) {

              Write-Error "EXE was not generated"

              exit 1

          }


          Get-Item "dist/ewbBleConfigurator_v1.4.0.exe"


      # 上传EXE
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:

          name: ewbBleConfigurator_v1.4.0_Win64

          path: dist/ewbBleConfigurator_v1.4.0.exe
