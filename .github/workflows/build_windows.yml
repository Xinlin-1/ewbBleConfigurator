name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller ^
            --onefile ^
            --console ^
            --name ewbBleConfigurator_v1.4.0 ^
            ewbBleConfigurator_v1.4.0.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ewbBleConfigurator_v1.4.0_Win64
          path: dist/ewbBleConfigurator_v1.4.0.exe
